name: Publish staged Homebrew bottles

on:
  push:
    branches: [main]
    paths: ["Formula/*.rb"]

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify and publish matching draft bottle releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, re, subprocess

          def run_gh(args):
              return subprocess.run(["gh", *args], check=False, text=True, capture_output=True)

          for rb in sorted(pathlib.Path("Formula").glob("*.rb")):
              text = rb.read_text(encoding="utf-8")
              m_root = re.search(r'^\s*root_url\s+"https://github\.com/ryanduguid/homebrew-tap/releases/download/(bottles-[^"]+)"', text, re.M)
              if not m_root:
                  continue
              tag = m_root.group(1)
              digests = dict(re.findall(r'sha256\s+(?:cellar:\s+:\w+,\s+)?([a-z0-9_]+):\s+"([0-9a-f]{64})"', text))
              if not digests:
                  continue
              r = run_gh(["release", "view", tag, "--json", "isDraft,assets"])
              if r.returncode != 0:
                  continue
              rel = json.loads(r.stdout)
              if not rel.get("isDraft"):
                  print(f"{tag}: already published")
                  continue
              asset_digests = {a["name"]: (a.get("digest") or "").removeprefix("sha256:") for a in rel.get("assets", [])}
              mismatches = []
              for os_tag, want_sha in digests.items():
                  matched = any(want_sha == got_sha and os_tag in aname for aname, got_sha in asset_digests.items())
                  if not matched:
                      mismatches.append((os_tag, want_sha))
              if mismatches:
                  raise SystemExit(f"{tag}: digest mismatch against draft assets: {mismatches}")
              subprocess.check_call(["gh", "release", "edit", tag, "--draft=false"])
              print(f"Published immutable bottle release {tag}")
          PY
