name: Publish staged Homebrew bottles

on:
  push:
    branches: [main]
    paths: ["Formula/*.rb"]

concurrency:
  group: publish-bottles
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify and publish matching draft bottle releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, re, subprocess

          def run_gh(args):
              return subprocess.run(["gh", *args], check=False, text=True, capture_output=True)

          to_publish = []
          for rb in sorted(pathlib.Path("Formula").glob("*.rb")):
              text = rb.read_text(encoding="utf-8")
              m_root = re.search(
                  r'^\s*root_url\s+"https://github\.com/ryanduguid/homebrew-tap/releases/download/(bottles-[^"]+)"',
                  text,
                  re.M,
              )
              if not m_root:
                  continue
              tag = m_root.group(1)
              formula_name = rb.stem
              prefix = f"bottles-{formula_name}-"
              if not tag.startswith(prefix):
                  raise SystemExit(f"{rb}: unexpected bottle root_url tag {tag} for {formula_name}")
              version = tag.removeprefix(prefix)
              digests = dict(re.findall(r'sha256\s+(?:cellar:\s+:\w+,\s+)?([a-z0-9_]+):\s+"([0-9a-f]{64})"', text))
              if not digests:
                  raise SystemExit(f"{rb}: bottle root_url {tag} found without sha256 digests")
              r = run_gh(["release", "view", tag, "--json", "isDraft,assets"])
              if r.returncode != 0:
                  raise SystemExit(f"{tag}: release lookup failed for merged {rb}: {r.stderr.strip() or r.stdout.strip()}")
              rel = json.loads(r.stdout)
              asset_digests = {
                  a["name"]: (a.get("digest") or "").removeprefix("sha256:")
                  for a in rel.get("assets", [])
                  if a.get("state") == "uploaded"
              }
              mismatches = []
              for os_tag, want_sha in digests.items():
                  expected_name = f"{formula_name}-{version}.{os_tag}.bottle.tar.gz"
                  if asset_digests.get(expected_name) != want_sha:
                      mismatches.append((expected_name, want_sha))
              if mismatches:
                  raise SystemExit(f"{tag}: digest mismatch against release assets: {mismatches}")
              if rel.get("isDraft"):
                  to_publish.append(tag)
              else:
                  print(f"{tag}: already published and verified")

          # GitHub Releases lacks multi-release transactions; all referenced releases
          # are preflighted above under workflow concurrency, and failed promotions
          # can be safely re-run idempotently without --clobber.
          for tag in to_publish:
              subprocess.check_call(["gh", "release", "edit", tag, "--draft=false"])
              print(f"Published immutable bottle release {tag}")
          PY
