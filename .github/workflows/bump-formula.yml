name: Bump formula version

on:
  workflow_dispatch:
    inputs:
      formula:
        description: "Formula name matching Formula/<name>.rb"
        required: true
        type: string
      version:
        description: "New upstream version without leading v (e.g. 3.9.0)"
        required: true
        type: string
      url:
        description: "New upstream source archive URL"
        required: true
        type: string
      sha256:
        description: "64-hex SHA-256 of the upstream source archive"
        required: true
        type: string

permissions: {}

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.TAP_PR_TOKEN || secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Update formula and open PR
        id: update
        env:
          GH_TOKEN: ${{ secrets.TAP_PR_TOKEN || secrets.GITHUB_TOKEN }}
          FORMULA: ${{ inputs.formula }}
          VERSION: ${{ inputs.version }}
          URL: ${{ inputs.url }}
          SHA256: ${{ inputs.sha256 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, re, sys

          formula = os.environ["FORMULA"].strip()
          version = os.environ["VERSION"].strip()
          url = os.environ["URL"].strip()
          sha256 = os.environ["SHA256"].strip().lower()

          if not re.fullmatch(r"[a-z0-9-]+", formula) or not (pathlib.Path("Formula") / f"{formula}.rb").is_file():
              sys.exit(f"unknown formula: {formula}")
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z]+)*", version):
              sys.exit(f"invalid version: {version}")
          if not re.fullmatch(r"https://github\.com/ryanduguid/[^\s\"']+", url):
              sys.exit(f"invalid url: {url}")
          if not re.fullmatch(r"[0-9a-f]{64}", sha256):
              sys.exit(f"invalid sha256: {sha256}")

          path = pathlib.Path("Formula") / f"{formula}.rb"
          text = path.read_text(encoding="utf-8")
          text, n_url = re.subn(r'^  url ".*"$', f'  url "{url}"', text, count=1, flags=re.M)
          text, n_sha = re.subn(r'^  sha256 "[0-9a-f]{64}"$', f'  sha256 "{sha256}"', text, count=1, flags=re.M)
          if n_url != 1 or n_sha != 1:
              sys.exit(f"expected 1 url and 1 sha256 in {path}, got {n_url} and {n_sha}")
          text = re.sub(r'\n  bottle do\n(?:.*\n)*?  end\n\n?', '\n', text)
          path.write_text(text, encoding="utf-8", newline="\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"formula={formula}\nversion={version}\n")
          PY

      - name: Open version bump pull request
        env:
          GH_TOKEN: ${{ secrets.TAP_PR_TOKEN || secrets.GITHUB_TOKEN }}
          FORMULA: ${{ steps.update.outputs.formula }}
          VERSION: ${{ steps.update.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="ryan/bump-${FORMULA}-${VERSION}"
          git checkout -b "$branch"
          git add "Formula/${FORMULA}.rb"
          git commit -m "Bump ${FORMULA} to ${VERSION}"
          git push origin "refs/heads/${branch}"
          gh pr create \
            --base main \
            --head "$branch" \
            --draft \
            --title "Bump ${FORMULA} to ${VERSION}" \
            --body "Updates \`Formula/${FORMULA}.rb\` to ${VERSION} and clears stale bottle digests. Run \`Build and publish Homebrew bottles\` if prebuilt bottles are desired."
