name: No AI attribution

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: attribution-${{ github.event_name }}-${{ github.event_name == 'pull_request_target' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  policy:
    name: Attribution policy
    if: ${{ github.event_name != 'push' || github.event.deleted != true }}
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    uses: ryanduguid/release-policy/.github/workflows/attribution-policy.yml@d7039efe6d8c441f1f213c674902909e80535599
