name: Test Homebrew formulae

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-formulae:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Homebrew on Linux
        if: runner.os == 'Linux'
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
          echo "/home/linuxbrew/.linuxbrew/sbin" >> "$GITHUB_PATH"
          echo "HOMEBREW_PREFIX=/home/linuxbrew/.linuxbrew" >> "$GITHUB_ENV"
          echo "HOMEBREW_CELLAR=/home/linuxbrew/.linuxbrew/Cellar" >> "$GITHUB_ENV"
          echo "HOMEBREW_REPOSITORY=/home/linuxbrew/.linuxbrew/Homebrew" >> "$GITHUB_ENV"

      - name: Tap local checkout
        run: |
          brew tap ryanduguid/tap "$GITHUB_WORKSPACE"
          brew trust ryanduguid/tap

      - name: Audit, install and test changed or all formulae
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          formulae=()
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$BASE_SHA" ]; then
            if git diff --quiet "$BASE_SHA" HEAD -- .github/workflows/ci.yml; then
              while IFS= read -r path; do
                [ -f "$path" ] && formulae+=("$(basename "$path" .rb)")
              done < <(git diff --name-only "$BASE_SHA" HEAD -- 'Formula/*.rb')
            fi
          fi
          if [ "${#formulae[@]}" -eq 0 ]; then
            for f in Formula/*.rb; do
              formulae+=("$(basename "$f" .rb)")
            done
          fi
          for name in "${formulae[@]}"; do
            echo "=== Auditing $name ==="
            brew audit --strict --formula "ryanduguid/tap/$name"
            install_flags=(--verbose)
            if ! grep -q "bottle do" "Formula/${name}.rb"; then
              install_flags+=(--build-from-source)
            fi
            echo "=== Installing $name (${install_flags[*]}) ==="
            brew install "${install_flags[@]}" "ryanduguid/tap/$name"
            echo "=== Testing $name ==="
            brew test "ryanduguid/tap/$name"
          done
