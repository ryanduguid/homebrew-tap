name: Build and publish Homebrew bottles

on:
  workflow_dispatch:
    inputs:
      formula:
        description: "Formula name to bottle, or 'all'"
        required: true
        default: "all"
        type: string

permissions: {}

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_work: ${{ steps.set-matrix.outputs.has_work }}
      formula_arg: ${{ steps.set-matrix.outputs.formula_arg }}
      formulae: ${{ steps.set-matrix.outputs.formulae }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate input and compute build matrix
        id: set-matrix
        env:
          INPUT_FORMULA: ${{ inputs.formula }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, sys
          inp = os.environ["INPUT_FORMULA"].strip()
          available = sorted(p.stem for p in pathlib.Path("Formula").glob("*.rb"))
          if inp == "all":
              formulae = [
                  f
                  for f in available
                  if not re.search(
                      r"^\s*bottle do\b",
                      (pathlib.Path("Formula") / f"{f}.rb").read_text(encoding="utf-8"),
                      re.M,
                  )
              ]
          elif re.fullmatch(r"[a-z0-9-]+", inp) and inp in available:
              formulae = [inp]
          else:
              sys.exit(f"unknown formula {inp!r}; expected 'all' or one of {available}")
          items = [
              {"formula": f, "os": os_name}
              for f in formulae
              for os_name in ["macos-latest", "ubuntu-latest", "ubuntu-24.04-arm"]
          ]
          has_work = "true" if items else "false"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write("matrix=" + json.dumps({"include": items}) + "\n")
              fh.write(f"has_work={has_work}\n")
              fh.write(f"formula_arg={inp}\n")
              fh.write(f"formulae={' '.join(formulae)}\n")
          PY

  build:
    needs: resolve
    if: ${{ needs.resolve.outputs.has_work == 'true' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Homebrew on Linux
        if: runner.os == 'Linux'
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          {
            echo "/home/linuxbrew/.linuxbrew/bin"
            echo "/home/linuxbrew/.linuxbrew/sbin"
          } >> "$GITHUB_PATH"
          {
            echo "HOMEBREW_PREFIX=/home/linuxbrew/.linuxbrew"
            echo "HOMEBREW_CELLAR=/home/linuxbrew/.linuxbrew/Cellar"
            echo "HOMEBREW_REPOSITORY=/home/linuxbrew/.linuxbrew/Homebrew"
          } >> "$GITHUB_ENV"

      - name: Build and test bottle
        env:
          FORMULA: ${{ matrix.formula }}
        run: |
          set -euo pipefail
          brew tap ryanduguid/tap "$GITHUB_WORKSPACE"
          brew trust ryanduguid/tap
          version="$(brew info --json=v2 "ryanduguid/tap/$FORMULA" | python3 -c 'import json,sys; print(json.load(sys.stdin)["formulae"][0]["versions"]["stable"])')"
          tag="bottles-${FORMULA}-${version}"
          root_url="https://github.com/ryanduguid/homebrew-tap/releases/download/${tag}"
          mkdir -p bottle-out
          cd bottle-out
          brew install --verbose --build-bottle "ryanduguid/tap/$FORMULA"
          brew test "ryanduguid/tap/$FORMULA"
          brew bottle --no-rebuild --json --root-url="$root_url" "ryanduguid/tap/$FORMULA"
          ls -la

      - name: Upload bottle artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bottle-${{ matrix.formula }}-${{ matrix.os }}
          path: bottle-out/*
          if-no-files-found: error

  publish:
    needs: [resolve, build]
    if: ${{ needs.resolve.outputs.has_work == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
      pull-requests: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.TAP_PR_TOKEN || secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Configure Homebrew on Linux
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          {
            echo "/home/linuxbrew/.linuxbrew/bin"
            echo "/home/linuxbrew/.linuxbrew/sbin"
          } >> "$GITHUB_PATH"
          {
            echo "HOMEBREW_PREFIX=/home/linuxbrew/.linuxbrew"
            echo "HOMEBREW_CELLAR=/home/linuxbrew/.linuxbrew/Cellar"
            echo "HOMEBREW_REPOSITORY=/home/linuxbrew/.linuxbrew/Homebrew"
          } >> "$GITHUB_ENV"

      - name: Download all bottle artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: bottles-in
          pattern: bottle-*
          merge-multiple: true

      - name: Stage draft bottle releases and prepare formula update
        env:
          GH_TOKEN: ${{ secrets.TAP_PR_TOKEN || secrets.GITHUB_TOKEN }}
          FORMULAE: ${{ needs.resolve.outputs.formulae }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          tap_dir="$(brew --repository)/Library/Taps/ryanduguid/homebrew-tap"
          mkdir -p "$(dirname "$tap_dir")"
          ln -sfn "$GITHUB_WORKSPACE" "$tap_dir"
          brew trust ryanduguid/tap

          mkdir -p attest-out
          for name in $FORMULAE; do
            jsons=(bottles-in/"${name}"--*.bottle.json)
            if [ ! -e "${jsons[0]}" ]; then
              echo "Missing downloaded bottle JSON metadata for ${name}" >&2
              exit 1
            fi
            version="$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(next(iter(d.values()))["formula"]["pkg_version"])' "${jsons[0]}")"
            tag="bottles-${name}-${version}"

            mkdir -p "release-assets/${name}" "attest-out/${name}"
            python3 - "$name" "$tag" "$GITHUB_SHA" "release-assets/${name}" "attest-out/${name}" "${jsons[@]}" <<'PY'
          import hashlib, json, pathlib, shutil, subprocess, sys

          name, tag, target_sha, out_dir, attest_dir, *json_paths = sys.argv[1:]
          out = pathlib.Path(out_dir)
          att = pathlib.Path(attest_dir)
          for jp in json_paths:
              data = json.load(open(jp, encoding="utf-8"))
              info = next(iter(data.values()))
              for _os_tag, entry in info["bottle"]["tags"].items():
                  src = pathlib.Path(jp).parent / entry["local_filename"]
                  dst = out / entry["filename"]
                  shutil.copy2(src, dst)

          checksum_lines = []
          want_digests = {}
          for fpath in sorted(p for p in out.iterdir() if p.is_file() and p.name != "SHA256SUMS"):
              digest = hashlib.sha256(fpath.read_bytes()).hexdigest()
              checksum_lines.append(f"{digest}  {fpath.name}\n")
              want_digests[fpath.name] = digest
          sums_path = out / "SHA256SUMS"
          sums_path.write_text("".join(checksum_lines), encoding="utf-8", newline="\n")
          want_digests["SHA256SUMS"] = hashlib.sha256(sums_path.read_bytes()).hexdigest()

          for fpath in sorted(out.iterdir()):
              shutil.copy2(fpath, att / fpath.name)

          r = subprocess.run(["gh", "release", "view", tag, "--json", "isDraft,assets"], check=False, text=True, capture_output=True)
          if r.returncode != 0:
              err = (r.stderr or r.stdout or "").lower()
              if "release not found" not in err:
                  raise SystemExit(f"{tag}: release lookup failed: {(r.stderr or r.stdout).strip()}")
              version = tag.removeprefix(f"bottles-{name}-")
              subprocess.check_call([
                  "gh", "release", "create", tag,
                  *(str(p) for p in sorted(out.iterdir())),
                  "--draft",
                  "--target", target_sha,
                  "--title", f"Bottles for {name} {version}",
                  "--notes", f"Prebuilt Homebrew bottles for {name} {version} (staged draft; published upon PR merge).",
              ])
          else:
              rel = json.loads(r.stdout)
              if not rel.get("isDraft"):
                  raise SystemExit(f"Release {tag} is already published (immutable releases cannot be mutated).")
              got_digests = {
                  a["name"]: (a.get("digest") or "").removeprefix("sha256:")
                  for a in rel.get("assets", [])
                  if a.get("state") == "uploaded"
              }
              if got_digests != want_digests:
                  raise SystemExit(f"Existing draft release {tag} assets/digests do not match this build; delete the stale draft before rerunning.")
              print(f"Reusing matching intact draft release {tag}")
          PY

            brew bottle --merge --write --no-commit --keep-old "${jsons[@]}"
          done

      - name: Attest bottle provenance
        if: ${{ hashFiles('attest-out/*/*.tar.gz') != '' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: attest-out/*/*

      - name: Open bottle update pull request
        env:
          GH_TOKEN: ${{ secrets.TAP_PR_TOKEN || secrets.GITHUB_TOKEN }}
          INPUT_FORMULA: ${{ needs.resolve.outputs.formula_arg }}
        run: |
          set -euo pipefail
          if git diff --quiet Formula/; then
            echo "No formula changes to commit."
            exit 0
          fi
          branch="ryan/bottles-${INPUT_FORMULA}-${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          git add Formula/
          git commit -m "Update Homebrew bottles for ${INPUT_FORMULA}"
          git push origin "refs/heads/${branch}"
          gh pr create \
            --base main \
            --head "$branch" \
            --draft \
            --title "Update Homebrew bottles for ${INPUT_FORMULA}" \
            --body "Adds prebuilt macOS and Linux Homebrew bottles staged from workflow run ${GITHUB_RUN_ID}. Merging promotes the matching draft bottle release."
